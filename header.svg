<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="fuchv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#0a0510"/>

  <!-- code rain (pink/fuchsia) -->
  <g font-size="12" opacity="0.18">
    <text x="50" fill="#ec4899"><tspan x="50" dy="0">0</tspan><tspan x="50" dy="15">1</tspan><tspan x="50" dy="15">1</tspan><tspan x="50" dy="15">0</tspan><tspan x="50" dy="15">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -80;0 340" dur="7s" repeatCount="indefinite"/></text>
    <text x="140" fill="#d946ef"><tspan x="140" dy="0">1</tspan><tspan x="140" dy="15">0</tspan><tspan x="140" dy="15">1</tspan><tspan x="140" dy="15">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -120;0 340" dur="9s" repeatCount="indefinite"/></text>
    <text x="660" fill="#ec4899"><tspan x="660" dy="0">1</tspan><tspan x="660" dy="15">1</tspan><tspan x="660" dy="15">0</tspan><tspan x="660" dy="15">1</tspan><tspan x="660" dy="15">0</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -60;0 340" dur="8s" repeatCount="indefinite"/></text>
    <text x="750" fill="#f472b6"><tspan x="750" dy="0">0</tspan><tspan x="750" dy="15">1</tspan><tspan x="750" dy="15">0</tspan><tspan x="750" dy="15">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -100;0 340" dur="6.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#ec4899" stroke-width="2" fill="none" opacity="0.8">
    <path d="M24,52 v-28 h28"/><path d="M776,52 v-28 h-28"/><path d="M24,268 v28 h28"/><path d="M776,268 v28 h-28"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- ===== CAT MASCOT with glasses + PC ===== -->
  <g transform="translate(400,0)">
    <!-- tail -->
    <path d="M30,118 Q58,116 56,92" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M30,118 Q58,116 56,92;M30,118 Q58,110 48,88;M30,118 Q58,116 56,92" dur="3s" repeatCount="indefinite"/></path>
    <!-- body -->
    <ellipse cx="0" cy="118" rx="34" ry="24" fill="#f9a8d4"/>
    <!-- paws -->
    <rect x="-16" y="104" width="9" height="16" rx="4" fill="#f472b6"/><rect x="7" y="104" width="9" height="16" rx="4" fill="#f472b6"/>
    <!-- ears -->
    <polygon points="-22,46 -26,24 -8,40" fill="#f9a8d4"/><polygon points="22,46 26,24 8,40" fill="#f9a8d4"/>
    <polygon points="-19,43 -21,31 -11,40" fill="#ec4899"/><polygon points="19,43 21,31 11,40" fill="#ec4899"/>
    <!-- head -->
    <circle cx="0" cy="64" r="26" fill="#f9a8d4"/>
    <!-- sunglasses -->
    <rect x="-20" y="58" width="40" height="5" rx="2" fill="#1f2937"/>
    <circle cx="-9" cy="62" r="8" fill="#1f2937" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="9" cy="62" r="8" fill="#1f2937" stroke="#ec4899" stroke-width="1.5"/>
    <path d="M-9,58 l3,-1 M9,58 l3,-1" stroke="#fbcfe8" stroke-width="1.4"/>
    <!-- cheeks + mouth -->
    <ellipse cx="-14" cy="72" rx="4" ry="2.5" fill="#ec4899" opacity="0.6"/><ellipse cx="14" cy="72" rx="4" ry="2.5" fill="#ec4899" opacity="0.6"/>
    <path d="M-2,72 l4,0 l-2,3 z" fill="#be185d"/>
    <path d="M0,75 q-4,4 -8,2 M0,75 q4,4 8,2" fill="none" stroke="#9d174d" stroke-width="1.3"/>
    <g stroke="#fbcfe8" stroke-width="1"><line x1="-24" y1="70" x2="-40" y2="68"/><line x1="-24" y1="75" x2="-40" y2="78"/><line x1="24" y1="70" x2="40" y2="68"/><line x1="24" y1="75" x2="40" y2="78"/></g>
    <!-- laptop -->
    <rect x="-24" y="86" width="48" height="30" rx="2" fill="#05070a" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="-20" y="90" width="22" height="3" fill="#f472b6"><animate attributeName="width" values="22;34;22" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="-20" y="96" width="34" height="3" fill="#d946ef"><animate attributeName="width" values="34;18;34" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="-20" y="102" width="16" height="3" fill="#fbcfe8"><animate attributeName="width" values="16;28;16" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="-20" y="108" width="28" height="3" fill="#f472b6"><animate attributeName="width" values="28;14;28" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="-30" y="116" width="60" height="4" rx="1" fill="#831843"/>
  </g>

  <!-- ALICIA glitch (fuchsia) -->
  <g font-size="50" font-weight="bold" letter-spacing="6" text-anchor="middle">
    <text x="395" y="188" fill="#a855f7" opacity="0.8">ALICIA
      <animate attributeName="opacity" values="0;0.8;0;0.5;0;0.7;0" keyTimes="0;0.05;0.1;0.5;0.55;0.6;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="405" y="188" fill="#f9a8d4" opacity="0.7">ALICIA
      <animate attributeName="opacity" values="0;0;0.7;0;0.6;0;0" keyTimes="0;0.04;0.09;0.12;0.52;0.57;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="400" y="188" fill="url(#fuchv)">ALICIA
      <animate attributeName="opacity" values="1;1;0.6;1;1;0.7;1" keyTimes="0;0.04;0.06;0.08;0.5;0.53;1" dur="4s" repeatCount="indefinite"/></text>
  </g>
  <text x="400" y="214" fill="#f472b6" font-size="15" font-weight="bold" letter-spacing="7" text-anchor="middle">VALDERRAMA · SIEMPIRA</text>
  <text x="400" y="238" fill="#ec4899" font-size="11" letter-spacing="4" text-anchor="middle">FULL-STACK POLYGLOT · BACKEND · DATA · INFRASTRUCTURE</text>

  <line x1="270" y1="254" x2="530" y2="254" stroke="#ec4899" stroke-width="1" opacity="0.4"/>
  <text x="400" y="280" fill="#f9a8d4" font-size="12" font-weight="bold" letter-spacing="4" text-anchor="middle">23 LANGUAGES ONLINE · ella/su
    <animate attributeName="opacity" values="1;1;0.4;1;1" keyTimes="0;0.46;0.5;0.54;1" dur="2.4s" repeatCount="indefinite"/></text>

  <rect x="0" width="800" height="10" fill="#ec4899" opacity="0.05"><animate attributeName="y" values="0;320" dur="4s" repeatCount="indefinite"/></rect>
</svg>
